<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1746" viewBox="0 0 1360 1746" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a Trait</title>
  <desc id="desc">A complete colocate-small-domain-errors trait, with routed connectors from its name, subject, requirement, purpose, and Markdown context to explanations below. This preference requires judgment about domain meaning, ownership, and dependencies.</desc>
  <defs>
    <radialGradient id="paper"><stop stop-color="#342a30"/><stop offset="1" stop-color="#241d28"/></radialGradient>
    <pattern id="ornament" width="40" height="20" y="8" patternUnits="userSpaceOnUse"><path d="M23 5c-9-5-14 9-4 9 5 0 7-6 2-7-5-1-6 7 2 10" fill="none" stroke="#c7aa6a" stroke-width=".8"/></pattern>
    <style>
      .serif { font-family: 'Libre Baskerville', Georgia, serif; }
      .mono { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 27px; }
      .body { font-family: 'Libre Baskerville', Georgia, serif; font-size: 26px; fill: #c7bbc5; }
      .wire { fill: none; stroke-width: 1.5; stroke-linecap: butt; stroke-linejoin: miter; opacity: .55; }
      .label { font-family: 'Libre Baskerville', Georgia, serif; font-size: 29px; }
    </style>
  </defs>
  <path fill="url(#paper)" d="M0 0h1360v1746H0z"/>
