  <g class="label">
    <text x="170" y="950" fill="#d8b975">01 · NAME</text>
    <text x="170" y="1040" fill="#aeb4cf">02 · SUBJECT</text>
    <text x="170" y="1130" fill="#b9c7a5">03 · REQUIREMENT</text>
    <text x="170" y="1220" fill="#d99a90">04 · PURPOSE</text>
    <text x="170" y="1310" fill="#c5a3c4">05 · CONTEXT</text>
  </g>
  <g class="body">
    <text x="170" y="988">A minimal name with which to reference this trait from chat.</text>
    <text x="170" y="1078">What to look at. Identifies the thing being assessed.</text>
    <text x="170" y="1168">What should be true about the subject. The authoritative rule.</text>
    <text x="170" y="1258">The reason behind it. What the preference aims to protect.</text>
    <text x="170" y="1348">Any additional context with which the agent should interpret</text>
    <text x="170" y="1384">the current trait.</text>
  </g>
