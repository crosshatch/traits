  <text x="665" y="188" text-anchor="middle" fill="#ece0cf" class="serif" font-size="90">Anatomy of a Trait</text>
  <text x="665" y="253" text-anchor="middle" fill="#cbb172" class="serif" font-size="38" font-style="italic">Insight your agent infers from your feedback.</text>

  <g transform="translate(0 16)">
  <g transform="translate(-150 10)">
  <rect x="286" y="285" width="1058" height="792" fill="#201a23" fill-opacity=".6" stroke="#504052"/>
  <text x="318" y="318" class="mono" fill="#9f929f" style="font-size:23px">.agents/traits/colocate-small-domain-errors.md</text>
  <path d="M286 337h1058" stroke="#504052"/>
  <g class="mono" fill="#ece0cf">
    <text x="318" y="369" fill="#958997">---</text>
    <text x="318" y="409"><tspan fill="#d8b975">name:</tspan> colocate-small-domain-errors</text>
    <text x="318" y="455"><tspan fill="#aeb4cf">subject:</tspan> Small domain-specific error types.</text>
    <text x="318" y="501"><tspan fill="#b9c7a5">requirement:</tspan> Define small domain-specific error types</text>
    <text x="349" y="535">alongside the domain operations that produce them rather than</text>
    <text x="349" y="569">creating standalone error modules, unless separate ownership</text>
    <text x="349" y="603">or dependency constraints justify a separate module.</text>
    <text x="318" y="649"><tspan fill="#d99a90">purpose:</tspan> Keep small error definitions close to their</text>
    <text x="349" y="683">meaning and avoid unnecessary module fragmentation.</text>
    <text x="318" y="723" fill="#958997">---</text>
    <text x="318" y="787" fill="#958997">```diff</text>
    <text x="318" y="817" fill="#d99a90">-// Parse.ts</text>
    <text x="318" y="847" fill="#d99a90">-import { InvalidDocument } from "./InvalidDocument.ts"</text>
    <text x="318" y="877" fill="#b9c7a5">+// Parse.ts: the small error belongs to this operation.</text>
    <text x="318" y="907" fill="#b9c7a5">+export class InvalidDocument</text>
    <text x="318" y="937" fill="#b9c7a5">+<tspan x="349">extends S.TaggedError&lt;InvalidDocument&gt;()(</tspan></text>
    <text x="318" y="967" fill="#b9c7a5">+<tspan x="380">"InvalidDocument",</tspan></text>
    <text x="318" y="997" fill="#b9c7a5">+<tspan x="380">{ path: S.String }</tspan></text>
    <text x="318" y="1027" fill="#b9c7a5">+<tspan x="349">) {}</tspan></text>
    <text x="318" y="1057" fill="#958997">```</text>
  </g>

  </g>

  <!-- Staggered side channels reach full-width rows without crossing text. -->
