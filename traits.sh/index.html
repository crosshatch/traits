    />
    <meta name="theme-color" content="#faf4e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241d28" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        const theme = localStorage.getItem("traits-theme")
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.content = theme === "dark" ? "#241d28" : "#faf4e3"
          }
        }
      } catch {}
    </script>
