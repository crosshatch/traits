name: Changesets
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  changesets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MADHATCHER_PAT }}
      - run: |
          git config user.name "madhatcher"
          git config user.email "144481279+madhatcher@users.noreply.github.com"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          setupGitUser: false
          version: bash -c "pnpm changeset version && pnpm format"
          publish: pnpm changeset publish
          commit: version packages
          title: version packages
          prDraft: create
        env:
          GITHUB_TOKEN: ${{ secrets.MADHATCHER_PAT }}
