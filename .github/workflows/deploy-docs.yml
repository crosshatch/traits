name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) ||
    github.ref }}

jobs:
  alchemize:
    if:
      ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy or destroy stage
        if: ${{ github.event_name == 'pull_request' || github.ref_name == 'main' }}
        env:
          ACTION: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && 'destroy' || 'deploy' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.number || '' }}
          STAGE: ${{ github.event_name == 'pull_request' && format('staging-{0}', github.event.number) || 'prod' }}
        run: pnpm exec alchemy "$ACTION" --stage "$STAGE" --yes
